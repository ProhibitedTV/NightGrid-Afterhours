name: Brickwater focused art QA
on:
  push:
    branches: [art/brickwater-gold-slice]
    paths:
      - 'scripts/brickwater*.gd'
      - 'scripts/city_details.gd'
      - 'assets/shaders/brickwater*'
      - 'assets/models/nightgrid/brickwater*/**'
      - 'tests/brickwater_alley_smoke.gd'
      - 'tests/photo_masonry_smoke.gd'
      - 'tools/capture_brickwater_gold.gd'
      - '.github/workflows/brickwater-gold-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: brickwater-focused-${{ github.ref }}
  cancel-in-progress: true
jobs:
  targeted:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
      - name: Prepare offline speech
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng
          python3 tools/generate_mbpd_radio.py
      - name: Audit pinned source resources
        run: python3 tools/check_brickwater_cc0.py
      - name: Import and targeted tests
        run: |
          set -euo pipefail
          godot --headless --path . --import --quit 2>&1 | tee /tmp/brickwater-import.log
          if grep -E 'SCRIPT ERROR:|Shader compilation failed' /tmp/brickwater-import.log; then exit 1; fi
          for test in brickwater_alley_smoke photo_masonry_smoke; do
            timeout 75s godot --headless --path . --script "res://tests/$test.gd" 2>&1 | tee "/tmp/$test.log"
            if grep -E 'SCRIPT ERROR:|Shader compilation failed' "/tmp/$test.log"; then exit 1; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brickwater-targeted-logs
          path: /tmp/*brickwater*.log
          if-no-files-found: warn
  framebuffer:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
      - name: Prepare software renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libgl1 libx11-6 libxext6 libxrandr2 mesa-utils espeak-ng
          python3 tools/generate_mbpd_radio.py
          godot --headless --path . --import --quit 2>&1 | tee /tmp/gold-import.log
      - name: Capture four actual frames (Compatibility only)
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '3.3'
          NIGHTGRID_SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          export NIGHTGRID_GOLD_CAPTURE_DIR="$RUNNER_TEMP/brickwater-captures"
          timeout --kill-after=15s 300s xvfb-run -a -s "-screen 0 1280x720x24" godot --path . --display-driver x11 --rendering-driver opengl3 --rendering-method gl_compatibility --resolution 1280x720 --script res://tools/capture_brickwater_gold.gd 2>&1 | tee /tmp/gold-capture.log
          if grep -E 'SCRIPT ERROR:|Shader compilation failed' /tmp/gold-capture.log; then exit 1; fi
          grep -q 'GOLD_CAPTURE PASS' /tmp/gold-capture.log
          python3 - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          folder=Path(os.environ['NIGHTGRID_GOLD_CAPTURE_DIR'])
          record=json.loads((folder/'capture.json').read_text())
          assert record['revision']==os.environ['GITHUB_SHA']
          assert len(record['captures'])==4
          hashes=set()
          for name,meta in record['captures'].items():
              p=folder/name
              assert p.stat().st_size>16000
              digest=hashlib.sha256(p.read_bytes()).hexdigest()
              assert digest==meta['sha256']
              hashes.add(digest)
          assert len(hashes)==4
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brickwater-compatibility-captures-and-logs
          path: |
            ${{ runner.temp }}/brickwater-captures/
            /tmp/gold-*.log
          if-no-files-found: warn
          retention-days: 14
