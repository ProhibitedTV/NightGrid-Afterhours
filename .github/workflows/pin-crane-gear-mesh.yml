name: Pin original Crane & Gear glTF production art
# Build a deterministic ORIGINAL mesh once. Source-controlled generator derives
# nine Godot-ready maps from already pinned CC0 Poly Haven photo scans.
# A normal Windows game/build NEVER pulls textures or runs the authoring step.
on:
  push:
    branches: [art/west-docks-crane-gear-mesh-20261121]
    paths:
      - tools/author_crane_gear_gltf.py
      - .github/workflows/pin-crane-gear-mesh.yml
permissions:
  contents: write
jobs:
  author-source-asset:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic offline art processing dependencies
        run: python -m pip install Pillow==11.3.0
      - name: Author original measured wall/roof/glazing mesh and CC0 PBR derivatives
        run: python tools/author_crane_gear_gltf.py
      - name: Commit ONLY the generated original source-owned glTF kit to art branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "art/west-docks-crane-gear-mesh-20261121"
          git add -- assets/models/nightgrid/crane_gear/
          if git diff --cached --quiet; then
            echo "Deterministic glTF already pinned"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "art: pin original Crane & Gear glTF model and CC0 source-PBR derivatives"
          git push origin HEAD:refs/heads/art/west-docks-crane-gear-mesh-20261121
