name: Offline SFX authoring checks
on:
  push:
    paths:
      - 'tools/audio/**'
      - 'assets/audio/generated/synaxis/**'
      - '.github/workflows/sfx-authoring.yml'
  pull_request:
    paths:
      - 'tools/audio/**'
      - 'assets/audio/generated/synaxis/**'
      - '.github/workflows/sfx-authoring.yml'
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m unittest discover -s tools/audio -v
      - run: python tools/audio/generate_sfx.py list
      - run: python tools/audio/generate_sfx.py verify-staged
