name: Publish Beta.8 RC6 candidate
on:
  workflow_run:
    workflows: ["Project preflight", "Windows playtest build"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact tested main commit (40 hex characters)
        required: true
permissions:
  contents: write
  actions: read
concurrency:
  group: nightgrid-beta8-rc6
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || inputs.source_sha }}
      RELEASE_TAG: v0.1.0-beta.8-rc.6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require current main, exact successful preflight and exported Windows smoke
        id: gate
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          echo "publish=false" >> "$GITHUB_OUTPUT"
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" != "$SOURCE_SHA" ]; then
            echo "Newer main exists; skip stale candidate."
            exit 0
          fi
          if ! grep -Fxq 'const VERSION = "0.1.0-beta.8-rc.6"' scripts/build_info.gd; then
            echo "Not RC6 runtime; skip."
            exit 0
          fi
          for wf in preflight.yml windows-build.yml; do
            run="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?head_sha=$SOURCE_SHA&branch=main&event=push&status=success&per_page=10" --jq ".workflow_runs[] | select(.head_sha==\"$SOURCE_SHA\" and .head_branch==\"main\" and .event==\"push\" and .conclusion==\"success\") | .id" | head -n 1)"
            if [ -z "$run" ]; then
              echo "Waiting on exact main $wf; other completion event can publish."
              exit 0
            fi
            if [ "$wf" = windows-build.yml ]; then
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs" --jq '.jobs[] | select(.name=="Verify delivered Windows EXE/PCK and launch" and .conclusion=="success") | .id' | grep -E '^[0-9]+$'
              echo "windows_run=$run" >> "$GITHUB_OUTPUT"
            fi
          done
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "RC6 already published; no overwrite."
            exit 0
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Existing tag without release: refusing overwrite." >&2
            exit 1
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Download the actual already-tested Windows artifact
        if: steps.gate.outputs.publish == 'true'
        env:
          WINDOWS_RUN: ${{ steps.gate.outputs.windows_run }}
        run: |
          set -euo pipefail
          gh run download "$WINDOWS_RUN" --repo "$GITHUB_REPOSITORY" --name nightgrid-afterhours-windows-x64 --dir payload
          grep -Fx "Source commit: $SOURCE_SHA" payload/BUILD-INFO.txt
          grep -Fx "Channel: development" payload/BUILD-INFO.txt
          (cd payload && sha256sum -c SHA256SUMS.txt)
          test -s payload/NightGrid-Afterhours.exe
          test -s payload/NightGrid-Afterhours.pck
          mkdir -p dist
          package="NightGrid-Afterhours-$RELEASE_TAG-windows-x64"
          mkdir "$package"
          cp payload/* "$package/"
          cp docs/BETA8_RC6.md "$package/RELEASE-NOTES.md"
          (cd "$package" && sha256sum RELEASE-NOTES.md >> SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          zip -q -r "dist/$package.zip" "$package"
          unzip -t "dist/$package.zip"
          (cd dist && sha256sum "$package.zip" > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
      - name: Publish tested Windows playtest prerelease without overwriting
        if: steps.gate.outputs.publish == 'true'
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$SOURCE_SHA"
          package="NightGrid-Afterhours-$RELEASE_TAG-windows-x64"
          gh release create "$RELEASE_TAG" "dist/$package.zip" dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --title "NightGrid: Afterhours — Beta.8 RC6 — Seamless Interiors Preview" --notes-file docs/BETA8_RC6.md --prerelease
