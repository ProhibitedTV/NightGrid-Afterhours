name: Music palette contract
on:
  pull_request:
    paths:
      - 'tools/audio/nightgrid_music_batch.py'
      - 'tools/audio/neon_grunge_palette.json'
      - 'tests/test_neon_grunge_palette.py'
      - 'tests/test_music_quality_profiles.py'
      - '.github/workflows/music-palette.yml'
permissions:
  contents: read
jobs:
  palette:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tests/test_neon_grunge_palette.py
      - run: python tests/test_music_quality_profiles.py
