name: Capture expanded gameplay review (artifact only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
      - name: Prepare graphical Mesa renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libgl1 libx11-6 libxext6 libxrandr2 mesa-utils espeak-ng
          python3 tools/generate_mbpd_radio.py
      - name: Import game resources
        run: |
          set -o pipefail
          godot --headless --path . --import --quit 2>&1 | tee /tmp/nightgrid-expanded-import.log
          if grep -q 'SCRIPT ERROR:' /tmp/nightgrid-expanded-import.log; then exit 1; fi
      - name: Capture all 33 real game views
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '3.3'
          NIGHTGRID_SOURCE_REVISION: ${{ github.sha }}
          NIGHTGRID_EXPANDED_CAPTURE_DIR: ${{ runner.temp }}/expanded-review
        run: |
          set -o pipefail
          xvfb-run -a -s "-screen 0 1280x720x24" godot --path . --display-driver x11 --rendering-driver opengl3 --rendering-method gl_compatibility --resolution 1280x720 --script res://tools/capture_expanded_gallery.gd 2>&1 | tee /tmp/nightgrid-expanded-capture.log
          if grep -q 'SCRIPT ERROR:' /tmp/nightgrid-expanded-capture.log; then exit 1; fi
          grep -q 'SCREENSHOT_CAPTURE PASS:' /tmp/nightgrid-expanded-capture.log
      - name: Verify exact capture set and hashes
        env:
          NIGHTGRID_EXPANDED_CAPTURE_DIR: ${{ runner.temp }}/expanded-review
        run: |
          python3 tools/check_expanded_capture.py "$NIGHTGRID_EXPANDED_CAPTURE_DIR"
      - uses: actions/upload-artifact@v4
        with:
          name: expanded-gameplay-review
          path: ${{ runner.temp }}/expanded-review
          if-no-files-found: error
          retention-days: 30
