name: Import licensed 2K architectural textures to Central Exchange

on:
  push:
    branches:
      - art/central-exchange-photoreal-frontages-20261120
    paths:
      - tools/import_polyhaven_pbr.py
      - .github/workflows/import-central-pbr.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-central-exchange-pbr
  cancel-in-progress: false

jobs:
  verified-cc0-source-import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Import only specified Poly Haven CC0 PBR maps and source hashes
        run: python3 tools/import_polyhaven_pbr.py
      - name: Verify physical texture files and recorded attribution
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          p = Path('assets/pbr/polyhaven')
          source = json.loads((p / 'SOURCE.json').read_text())
          assert source['license'] == 'CC0 1.0'
          assert set(source['assets']) == {'brick_wall_001', 'blue_metal_plate'}
          for asset_id, asset in source['assets'].items():
              assert asset['asset'] == asset_id
              assert asset['license'] == 'CC0 1.0'
              assert set(asset['files']) == {'diffuse', 'nor_gl', 'rough'}
              for role, entry in asset['files'].items():
                  data = Path(entry['file']).read_bytes()
                  assert len(data) > 10000, (asset_id, role, len(data))
                  assert hashlib.sha256(data).hexdigest() == entry['sha256']
                  print(asset_id, role, len(data), entry['sha256'][:20])
          PY
      - name: Commit reproducible source-owned PBR textures to the same art branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pbr/polyhaven
          if git diff --cached --quiet; then
            echo "CC0 material maps unchanged"
          else
            git commit -m "assets: include verified Poly Haven CC0 2K brick and blue steel PBR sets"
            git pull --rebase origin art/central-exchange-photoreal-frontages-20261120
            git push origin HEAD:art/central-exchange-photoreal-frontages-20261120
          fi
      - name: Install Godot engine
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
      - name: Import PBR and test true building mesh before accepting visual asset
        run: |
          godot --headless --path . --import --quit
          godot --headless --path . --script res://tests/central_frontages_smoke.gd
