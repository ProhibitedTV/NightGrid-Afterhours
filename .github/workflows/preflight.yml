name: Project preflight
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check files and resource references
        run: python tools/check_project.py
      - name: Verify official CC0 shutter mesh, source hashes and photo maps
        run: python tools/check_cc0_shutter.py
      - name: Audit original CC0 HVAC mesh, four source PBR maps and per-file hashes
        run: python tools/check_cc0_aircon.py
      - name: Audit original Crane & Gear production glTF, source hashes and photo-PBR derivatives
        run: python tools/check_crane_gear_gltf.py
      - name: Verify original CC0 Hidden Alley source models and photo-derived road wear maps
        run: python tools/check_exchange_photo_street_kit.py
      - name: Audit source-authored Central Exchange concrete curbstones, steel drain glTF, and CC0 material hashes
        run: python tools/check_central_exchange_curbs.py
      - name: Audit original two photo-PBR walk-in store mesh glTFs, CC0 photos and collision source recipe
        run: python tools/check_exchange_storefronts.py
      - name: Assert Godot version and legacy physics/Vulkan pins in the clean checkout
        run: |
          python - <<'PY'
          from pathlib import Path
          config = Path("project.godot").read_text(encoding="utf-8")
          assert 'PackedStringArray("4.7", "Forward Plus")' in config, "Wrong Godot project feature"
          assert '3d/physics_engine="GodotPhysics3D"' in config, "Do not silently use Jolt"
          assert 'rendering_device/driver.windows="vulkan"' in config, "Preserve Windows Vulkan baseline"
          assert 'common/physics_ticks_per_second=60' in config, "Preserve game physics cadence"
          for name in ("preflight.yml", "windows-build.yml", "beta-release.yml"):
              workflow = Path(".github/workflows") / name
              assert "version: 4.7.2" in workflow.read_text(encoding="utf-8"), "Export template/engine mismatch: " + name
          print("ENGINE_PINS PASS: Godot 4.7.2, GodotPhysics3D, Vulkan, 60Hz")
          PY
      - name: Verify committed real game screenshots
        run: python tools/check_screenshots.py

  godot-headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
      - name: Generate original offline MBPD radio speech
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng
          python3 tools/generate_mbpd_radio.py
      - name: Import project and parse scripts
        run: |
          set -o pipefail
          godot --headless --path . --import --quit 2>&1 | tee /tmp/nightgrid-import.log
          if grep -q "SCRIPT ERROR:" /tmp/nightgrid-import.log; then exit 1; fi
      - name: Validate deterministic road routes, intersection turns and off-road access
        timeout-minutes: 2
        run: timeout 75s godot --headless --path . --script res://tests/street_route_smoke.gd
      - name: Validate bounded civic street restrictions and alternate routing
        timeout-minutes: 2
        run: |
          set -o pipefail
          timeout 75s godot --headless --path . --script res://tests/road_restrictions_smoke.gd 2>&1 | tee /tmp/nightgrid-road-restrictions.log
          if grep -q "SCRIPT ERROR:" /tmp/nightgrid-road-restrictions.log; then exit 1; fi
      - name: Validate restriction revision invalidates real map and HUD waypoint route
        timeout-minutes: 2
        run: |
          set -o pipefail
          timeout 75s godot --headless --path . --script res://tests/civic_waypoint_smoke.gd 2>&1 | tee /tmp/nightgrid-civic-waypoint.log
          if grep -q "SCRIPT ERROR:" /tmp/nightgrid-civic-waypoint.log; then exit 1; fi
      - name: Validate main menus, saved settings and controller action contexts
        timeout-minutes: 2
        run: |
          set -o pipefail
          timeout 75s godot --headless --path . --script res://tests/menus_gamepad_smoke.gd 2>&1 | tee /tmp/nightgrid-menu.log
          if grep -q "SCRIPT ERROR:" /tmp/nightgrid-menu.log; then exit 1; fi
      - name: Validate arcade weapon inventory, aim HUD, world damage, police heat and input gates
        timeout-minutes: 2
        run: |
          set -o pipefail
          timeout 75s godot --headless --path . --script res://tests/combat_smoke.gd 2>&1 | tee /tmp/nightgrid-combat.log
          if grep -q "SCRIPT ERROR:" /tmp/nightgrid-combat.log; then exit 1; fi
      - name: Validate radial equipment wheel input, pause ownership and ammo preservation
        timeout-minutes: 2
        run: |
          set -o pipefail
          timeout 75s godot --headless --path . --script res://tests/equipment_wheel_smoke.gd 2>&1 | tee /tmp/nightgrid-wheel.log
          if grep -q "SCRIPT ERROR:" /tmp/nightgrid-wheel.log; then exit 1; fi
      - name: Validate witnessed crime, police escalation and solid sight obstruction
        timeout-minutes: 2
        run: |
          set -o pipefail
          timeout 75s godot --headless --path . --script res://tests/wanted_smoke.gd 2>&1 | tee /tmp/nightgrid-wanted.log
          if grep -q "SCRIPT ERROR:" /tmp/nightgrid-wanted.log; then exit 1; fi
      - name: Validate policy-inspired police lane routing and emergency driving safety
        timeout-minutes: 2
        run: |
          set -o pipefail
          timeout 75s godot --headless --path . --script res://tests/police_drive_smoke.gd 2>&1 | tee /tmp/nightgrid-police-drive.log
          if grep -q "SCRIPT ERROR:" /tmp/nightgrid-police-drive.log; then exit 1; fi
      - name: Validate central dispatch, registered precincts and enterable headquarters
        timeout-minutes: 2
        run: |
          set -o pipefail
          timeout 75s godot --headless --path . --script res://tests/dispatch_smoke.gd 2>&1 | tee /tmp/nightgrid-dispatch.log
          if grep -q "SCRIPT ERROR:" /tmp/nightgrid-dispatch.log; then exit 1; fi
      - name: Validate independent ambient civic incident ledger
        timeout-minutes: 2
        run: |
          set -o pipefail
          timeout 75s godot --headless --path . --script res://tests/ambient_civic_smoke.gd 2>&1 | tee /tmp/nightgrid-ambient-civic.log
          if grep -q "SCRIPT ERROR:" /tmp/nightgrid-ambient-civic.log; then exit 1; fi
      - name: Validate physical civic patrol service lifecycle
        timeout-minutes: 2
        run: |
          set -o pipefail
          timeout 75s godot --headless --path . --script res://tests/civic_patrol_service_smoke.gd 2>&1 | tee /tmp/nightgrid-civic-patrol.log
          if grep -q "SCRIPT ERROR:" /tmp/nightgrid-civic-patrol.log; then exit 1; fi
      - name: Validate voiced fictional police communications and staffed station board
        timeout-minutes: 2
        run: |
          set -o pipefail
          timeout 75s godot --headless --path . --script res://tests/police_radio_smoke.gd 2>&1 | tee /tmp/nightgrid-radio.log
          if grep -q "SCRIPT ERROR:" /tmp/nightgrid-radio.log; then exit 1; fi
      - name: Validate Southworks solid cargo and player movement orientation regressions
        run: godot --headless --path . --script res://tests/southworks_playtest_smoke.gd
      - name: Validate fixed 60Hz physics and independent rendered train cadence
        run: godot --headless --path . --script res://tests/frame_pacing_smoke.gd
      - name: Validate on-device frame interval percentile and CSV capture integrity
        run: godot --headless --path . --script res://tests/frame_time_recorder_smoke.gd
      - name: Validate F10 real-frame evidence exporter, camera pose and paired metrics JSON
        run: godot --headless --path . --script res://tests/playtest_evidence_smoke.gd
      - name: Validate automatic local playtest logs and F7 incident markers
        run: godot --headless --path . --script res://tests/playtest_logger_smoke.gd
      - name: Assert city generation and district composition
        run: godot --headless --path . --script res://tests/city_smoke.gd
      - name: Validate physical world edges, coast and saved city layout
        run: godot --headless --path . --script res://tests/coastal_perimeter_smoke.gd
      - name: Validate lighting, authored world and flora
        run: godot --headless --path . --script res://tests/world_systems_smoke.gd
      - name: Validate F11 video-inspired ACES/sky render comparison and baseline restoration
        run: godot --headless --path . --script res://tests/render_comparison_smoke.gd
      - name: Validate single scanned Horizon fern, leaf cutouts and PBR normals
        run: godot --headless --path . --script res://tests/hero_fern_smoke.gd
      - name: Validate fixed lots and lighting/material policies
        run: godot --headless --path . --script res://tests/render_smoke.gd
      - name: Validate physically anchored storefront and street lighting with eight-light pool
        run: godot --headless --path . --script res://tests/practical_lighting_smoke.gd
      - name: Verify photo-glTF-source Central Exchange 3D shop practical lighting shares original 8 lamps across dusk/noon/night and streaming
        run: godot --headless --path . --script res://tests/central_exchange_shop_lighting_smoke.gd
      - name: Validate signals, transit boarding and persistent save seeds
        run: godot --headless --path . --script res://tests/transport_smoke.gd
      - name: Validate Kestrel S6 hero body, dynamic lights and save stability
        run: godot --headless --path . --script res://tests/hero_vehicle_smoke.gd
      - name: Audit closed Kestrel rear hatch manifold, trunk bulkhead and police variant
        run: godot --headless --path . --script res://tests/kestrel_rear_closure_smoke.gd
      - name: Validate Central Exchange junction architecture and signal-safe lighting
        run: godot --headless --path . --script res://tests/hero_intersection_smoke.gd
      - name: Validate real-source Central Exchange CC0 street props, collision shells and photo-PBR decals
        run: godot --headless --path . --script res://tests/central_exchange_street_kit_smoke.gd
      - name: Validate eight actual photo-PBR Central Exchange curb meshes, crossings, traffic and city save
        run: godot --headless --path . --script res://tests/central_exchange_authored_curbs_smoke.gd
      - name: Verify two source-authored Central Exchange walk-in 3D shopfronts with actual doorway physics and saved-city stream reload
        run: godot --headless --path . --script res://tests/central_exchange_walk_in_shops_smoke.gd
      - name: Validate 2K photographed road surface, crossing clearance and saved world
        run: godot --headless --path . --script res://tests/central_road_surface_smoke.gd
      - name: Validate new Central Exchange true-mesh architecture, source PBR and persistence
        run: godot --headless --path . --script res://tests/central_frontages_smoke.gd
      - name: Validate Dock Watch scanned-cladding architectural pilot, existing civic address and save
        run: godot --headless --path . --script res://tests/dock_watch_fidelity_smoke.gd
      - name: Validate source-owned glTF/PBR service frontage and save-stable Dock Watch neighbor
        run: godot --headless --path . --script res://tests/west_docks_cc0_art_smoke.gd
      - name: Verify West Docks realistic rooftop CC0 aircon variants and original UV steel mounts
        run: godot --headless --path . --script res://tests/west_docks_roof_hvac_smoke.gd
      - name: Validate original Crane & Gear architecture, photo PBR and permanent city streaming
        run: godot --headless --path . --script res://tests/crane_gear_gltf_smoke.gd
      - name: Validate permanent venues, opening hours and side quests
        run: godot --headless --path . --script res://tests/venues_smoke.gd
      - name: Validate NightGrid FM soundtrack catalog, radio and optional game audio pack
        run: godot --headless --path . --script res://tests/nightgrid_fm_smoke.gd
      - name: Validate original city soundscapes, footfalls and volume settings
        run: godot --headless --path . --script res://tests/world_audio_smoke.gd
      - name: Validate shared NPC streaming visibility and collision safeguards
        timeout-minutes: 2
        run: |
          set -o pipefail
          timeout 75s godot --headless --path . --script res://tests/streaming_safety_smoke.gd 2>&1 | tee /tmp/nightgrid-streaming-safety.log
          if grep -q "SCRIPT ERROR:" /tmp/nightgrid-streaming-safety.log; then exit 1; fi
      - name: Validate seeded sidewalk population and activation safety contract
        timeout-minutes: 2
        run: |
          set -o pipefail
          timeout 75s godot --headless --path . --script res://tests/sidewalk_population_smoke.gd 2>&1 | tee /tmp/nightgrid-sidewalk.log
          if grep -q "SCRIPT ERROR:" /tmp/nightgrid-sidewalk.log; then exit 1; fi
      - name: Validate bounded sidewalk link ground and obstacle certification
        timeout-minutes: 2
        run: |
          set -o pipefail
          timeout 75s godot --headless --path . --script res://tests/sidewalk_certification_smoke.gd 2>&1 | tee /tmp/nightgrid-sidewalk-certification.log
          if grep -q "SCRIPT ERROR:" /tmp/nightgrid-sidewalk-certification.log; then exit 1; fi
      - name: Validate logical traffic population and guarded streaming decisions
        timeout-minutes: 2
        run: |
          set -o pipefail
          timeout 75s godot --headless --path . --script res://tests/logical_traffic_smoke.gd 2>&1 | tee /tmp/nightgrid-logical-traffic.log
          if grep -q "SCRIPT ERROR:" /tmp/nightgrid-logical-traffic.log; then exit 1; fi
      - name: Validate positional road traffic buses and cars using bounded voice pool
        run: godot --headless --path . --script res://tests/traffic_spatial_audio_smoke.gd
      - name: Validate independent mix stems and all live interaction cues
        run: godot --headless --path . --script res://tests/audio_mix_actions_smoke.gd
      - name: Validate expanded eight-district seeded world and civic gameplay
        run: godot --headless --path . --script res://tests/expansion_smoke.gd
      - name: Validate on-demand district geometry and fully enterable interior rooms
        run: godot --headless --path . --script res://tests/streaming_interiors_smoke.gd
      - name: Validate predictive traversal streaming without multi-block frame spikes
        run: godot --headless --path . --script res://tests/predictive_streaming_smoke.gd
      - name: Validate staged parcel shells, deterministic completion and partial-load cancellation
        run: godot --headless --path . --script res://tests/staged_city_streaming_smoke.gd
      - name: Validate RenderingServer city visual batches, teardown and deterministic reload
        run: godot --headless --path . --script res://tests/render_server_city_smoke.gd
      - name: Verify occupied-cell colliders never trigger full synchronous visual construction
        run: godot --headless --path . --script res://tests/occupied_collision_streaming_smoke.gd
      - name: Validate Lantern Cup cinematic café interior, unique interaction and persistent save
        run: godot --headless --path . --script res://tests/lantern_cup_hero_smoke.gd
      - name: Validate Mara's character rig, reactive dialogue and indoor save lifecycle
        run: godot --headless --path . --script res://tests/mara_character_smoke.gd
      - name: Validate café crowd, animation, patron dialogue, economy and save restore
        run: godot --headless --path . --script res://tests/cafe_patrons_smoke.gd
      - name: Validate first-playtest club exit, camera obstruction, contact geometry and building fronts
        run: godot --headless --path . --script res://tests/playtest_geometry_smoke.gd
      - name: Run smoke test for 90 frames
        run: godot --headless --path . --quit-after 90
