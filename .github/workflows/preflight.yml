      - name: Verify the baked city textures match the original generator byte for byte
        run: godot --headless --path . --script res://tools/bake_city_material_maps.gd -- --verify
      - name: Validate opt-in Horizon Ridge expansion collision and original grid
        timeout-minutes: 2
        run: |
          set -o pipefail
          timeout 75s godot --headless --path . --script res://tests/horizon_ridge_smoke.gd -- --horizon-ridge 2>&1 | tee /tmp/nightgrid-ridge.log
