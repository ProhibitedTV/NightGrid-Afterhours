name: Project preflight
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer PR head replaces obsolete validation; main revisions stay independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test local creator build runner guards
        run: python -m unittest discover -s tools -p test_build_creator_playtest.py -v
      - name: Test offline F8 trace analyzer
        run: python -m unittest discover -s tools -p test_analyze_vehicle_trace.py -v
      - name: Test stationary F8 position trace analysis
        run: python -m unittest discover -s tools -p test_analyze_stationary_trace.py -v
      - name: Verify offline wardrobe authoring and manual review gates
        run: |
          python -m unittest discover -s tools/wardrobe -p 'test_*.py' -v
          python tools/wardrobe/release.py check-checkout
      - name: Check files and resource references
        run: python tools/check_project.py
      - name: Verify tracked documentation art containers
        run: |
          python tools/check_doc_art.py --self-test
          python tools/check_doc_art.py
      - name: Verify the twenty creator-owned NightGrid FM track hashes
        run: python tools/prepare_nightgrid_fm.py
      - name: Verify the CC0 Morrow Bay field recordings and footfall bank
        run: python tools/prepare_morrow_bay_audio.py
      - name: Verify official CC0 shutter mesh, source hashes and photo maps
        run: python tools/check_cc0_shutter.py
      - name: Audit original CC0 HVAC mesh, four source PBR maps and per-file hashes
        run: python tools/check_cc0_aircon.py
      - name: Audit original Crane & Gear production glTF, source hashes and photo-PBR derivatives
        run: python tools/check_crane_gear_gltf.py
      - name: Verify Kestrel authored front fascia and rear closure geometry and provenance
        run: |
          python tools/check_kestrel_fascia.py
          python tools/check_kestrel_rear.py
      - name: Validate Cinder R9 original glass, brakes, body fit, tire tread and sealed headlamps
        run: python -m unittest discover -s tests -p 'test_cinder_*.py' -v
      - name: Verify original CC0 Hidden Alley source models and photo-derived road wear maps
        run: python tools/check_exchange_photo_street_kit.py
      - name: Audit source-authored Central Exchange concrete curbstones, steel drain glTF, and CC0 material hashes
        run: python tools/check_central_exchange_curbs.py
      - name: Audit original two photo-PBR walk-in store mesh glTFs, CC0 photos and collision source recipe
        run: python tools/check_exchange_storefronts.py
      - name: Assert Godot version and legacy physics/Vulkan pins in the clean checkout
        run: |
          python - <<'PY'
          from pathlib import Path
          config = Path("project.godot").read_text(encoding="utf-8")
          assert 'PackedStringArray("4.7", "Forward Plus")' in config, "Wrong Godot project feature"
          assert '3d/physics_engine="GodotPhysics3D"' in config, "Do not silently use Jolt"
          assert 'rendering_device/driver.windows="vulkan"' in config, "Preserve Windows Vulkan baseline"
          assert 'common/physics_ticks_per_second=60' in config, "Preserve game physics cadence"
          for name in ("preflight.yml", "windows-build.yml", "beta-release.yml"):
              workflow = Path(".github/workflows") / name
              assert "version: 4.7.2" in workflow.read_text(encoding="utf-8"), "Export template/engine mismatch: " + name
          print("ENGINE_PINS PASS: Godot 4.7.2, GodotPhysics3D, Vulkan, 60Hz")
          PY
      - name: Test release gallery revision and runtime-tree gate in isolated git fixtures
        run: python tools/test_check_release_gallery.py
      - name: Test RC2 cockpit provenance gate against stale runtime and tampered evidence
        run: python tools/test_check_rc2_cockpit_gallery.py
      - name: Verify committed real game screenshots
        run: python tools/check_screenshots.py
      - name: Verify native Windows development gallery and original Git screenshot blobs
        run: python tools/check_development_gallery.py
      - name: Authenticate the eight original skybox game screenshot captures
        run: python tools/check_skybox_gallery.py
      - name: Audit nine pinned Brickwater CC0 source packages
        run: python tools/check_brickwater_cc0.py
      - name: Verify exact beta.7 capture provenance on the release candidate
        if: github.head_ref == 'release/beta-7-gallery-milestone' || github.ref == 'refs/heads/release/beta-7-gallery-milestone'
        run: |
          set -euo pipefail
          capture_sha="$(python3 -c 'import json; print(json.load(open("docs/screenshots/capture-manifest.json"))["source_revision"])')"
          [[ "$capture_sha" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "$capture_sha"
          python tools/check_release_gallery.py "$capture_sha"

  godot-headless:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
      - name: Generate original offline MBPD radio speech
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng
          python3 tools/generate_mbpd_radio.py
      - name: Import project and parse scripts
        run: |
          set -o pipefail
          godot --headless --path . --import --quit 2>&1 | tee /tmp/nightgrid-import.log
          if grep -Eq 'SCRIPT ERROR:|p_image->is_compressed\(\)|Cannot generate mipmaps from compressed image formats' /tmp/nightgrid-import.log; then exit 1; fi
      - name: Verify physical elevator call station availability
        run: godot --headless --path . --script res://tests/synaxis_lift_frontage_smoke.gd
      - name: Verify authored Synaxis breakroom and equipment
        timeout-minutes: 3
        run: |
          set -o pipefail
          timeout 150s godot --headless --path . --script res://tests/synaxis_breakroom_smoke.gd 2>&1 | tee /tmp/nightgrid-breakroom.log
          if grep -q "SCRIPT ERROR:" /tmp/nightgrid-breakroom.log; then exit 1; fi
          grep -q "SYNAXIS_BREAKROOM PASS:" /tmp/nightgrid-breakroom.log
      - name: Verify Daddy Stanky recurring underground contact
        timeout-minutes: 2
        run: |
          set -o pipefail
          timeout 45s godot --headless --path . --script res://tests/daddy_stanky_smoke.gd 2>&1 | tee /tmp/nightgrid-stanky.log
          if grep -q "SCRIPT ERROR:" /tmp/nightgrid-stanky.log; then exit 1; fi
          grep -q "STANKY PASS:" /tmp/nightgrid-stanky.log
      - name: Verify creator cast clean-checkout fallback or complete staged contract
        timeout-minutes: 3
        run: |
          set -o pipefail
          timeout 120s godot --headless --path . --script res://tests/synaxis_creator_cast_smoke.gd 2>&1 | tee /tmp/nightgrid-creator-cast.log
          if grep -q "SCRIPT ERROR:" /tmp/nightgrid-creator-cast.log; then exit 1; fi
          grep -q "SYNAXIS_CREATOR_CAST PASS:" /tmp/nightgrid-creator-cast.log
      - name: Verify cinematic Synaxis conversation coverage and cleanup
        timeout-minutes: 2
        run: |
          set -o pipefail
          timeout 45s godot --headless --path . --script res://tests/synaxis_cinematic_smoke.gd 2>&1 | tee /tmp/nightgrid-cinematic.log
          if grep -q "SCRIPT ERROR:" /tmp/nightgrid-cinematic.log; then exit 1; fi
          grep -q "SYNAXIS_CINEMATIC PASS:" /tmp/nightgrid-cinematic.log
      - name: Validate original studio ident and skippable launch handoff
        timeout-minutes: 2
        run: |
          set -o pipefail
          timeout 75s godot --headless --path . --script res://tests/studio_intro_smoke.gd 2>&1 | tee /tmp/nightgrid-studio-intro.log
          if grep -q "SCRIPT ERROR:" /tmp/nightgrid-studio-intro.log; then exit 1; fi
          grep -q "STUDIO_INTRO_SMOKE PASS:" /tmp/nightgrid-studio-intro.log
      - name: Verify transactional save replacement and rollback
        timeout-minutes: 1
        run: |
          set -o pipefail
          timeout 30s godot --headless --path . --script res://tests/atomic_save_smoke.gd 2>&1 | tee /tmp/nightgrid-atomic-save.log
          if grep -q "SCRIPT ERROR:" /tmp/nightgrid-atomic-save.log; then exit 1; fi
          grep -q "ATOMIC_SAVE PASS:" /tmp/nightgrid-atomic-save.log
      - name: Verify seamless physical building entry, collision and save
        timeout-minutes: 3
        run: |
          set -o pipefail
          timeout 150s godot --headless --path . --script res://tests/walk_in_lot_smoke.gd 2>&1 | tee /tmp/nightgrid-walk-in.log
          if grep -q "SCRIPT ERROR:" /tmp/nightgrid-walk-in.log; then exit 1; fi
          grep -q "WALK_IN_LOT PASS:" /tmp/nightgrid-walk-in.log
      - name: Verify fitted wardrobe accessory geometry and cache
        timeout-minutes: 2
        run: |
          set -o pipefail
          timeout 60s godot --headless --path . --script res://tests/wardrobe_accessories_smoke.gd 2>&1 | tee /tmp/nightgrid-wardrobe-accessories.log
          if grep -q "SCRIPT ERROR:" /tmp/nightgrid-wardrobe-accessories.log; then exit 1; fi
          grep -q "WARDROBE_ACCESSORIES PASS:" /tmp/nightgrid-wardrobe-accessories.log
      - name: Validate physical garage title grant and recovery clearance
