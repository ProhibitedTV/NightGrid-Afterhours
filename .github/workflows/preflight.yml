          timeout 75s godot --headless --path . --script res://tests/starter_garage_smoke.gd 2>&1 | tee /tmp/nightgrid-garage.log
          if grep -q "SCRIPT ERROR:" /tmp/nightgrid-garage.log; then exit 1; fi
          grep -q "GARAGE_SMOKE PASS:" /tmp/nightgrid-garage.log
      - name: Validate Morrow OS read-only app projections
        run: |
          set -o pipefail
          timeout 75s godot --headless --path . --script res://tests/morrow_phone_core_smoke.gd 2>&1 | tee /tmp/nightgrid-phone-core.log
          if grep -q "SCRIPT ERROR:" /tmp/nightgrid-phone-core.log; then exit 1; fi
          grep -q "MORROW_PHONE_CORE PASS" /tmp/nightgrid-phone-core.log
      - name: Validate real vending purchases, stamina and save migration
        timeout-minutes: 2
        run: |
          set -o pipefail
          timeout 75s godot --headless --path . --script res://tests/vending_smoke.gd 2>&1 | tee /tmp/nightgrid-vending.log
          if grep -q "SCRIPT ERROR:" /tmp/nightgrid-vending.log; then exit 1; fi
          grep -q "VENDING_SMOKE PASS:" /tmp/nightgrid-vending.log
      - name: Validate weighted locomotion, preserved movement and stride transitions
        timeout-minutes: 2
        run: |
          set -o pipefail
          timeout 75s godot --headless --path . --script res://tests/locomotion_smoke.gd 2>&1 | tee /tmp/nightgrid-locomotion.log
          if grep -q "SCRIPT ERROR:" /tmp/nightgrid-locomotion.log; then exit 1; fi
          grep -q "LOCOMOTION_SMOKE PASS:" /tmp/nightgrid-locomotion.log
      - name: Measure imported courier foot contacts and natural stride speeds
        timeout-minutes: 2
        run: |
          set -o pipefail
          timeout 60s godot --headless --path . --script res://tools/analyze_courier_gaits.gd 2>&1 | tee /tmp/nightgrid-gait-analysis.log
          if grep -q "SCRIPT ERROR:" /tmp/nightgrid-gait-analysis.log; then exit 1; fi
          grep -q "GAIT_ANALYSIS PASS:" /tmp/nightgrid-gait-analysis.log
          grep "GAIT_ANALYSIS_JSON " /tmp/nightgrid-gait-analysis.log | sed 's/^GAIT_ANALYSIS_JSON //' > /tmp/nightgrid-gait-profile.json
      - name: Upload measured courier gait evidence
        uses: actions/upload-artifact@v4
        with:
          name: courier-gait-profile
          path: /tmp/nightgrid-gait-profile.json
          if-no-files-found: error
      - name: Validate bounded player terrain foot correction
        timeout-minutes: 2
        run: |
          set -o pipefail
          timeout 75s godot --headless --path . --script res://tests/terrain_feet_smoke.gd 2>&1 | tee /tmp/nightgrid-terrain-feet.log
