name: Project preflight
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check files and resource references
        run: python tools/check_project.py
      - name: Verify committed real game screenshots
        run: python tools/check_screenshots.py

  godot-headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
      - name: Import project and parse scripts
        run: godot --headless --path . --import --quit
      - name: Validate fixed 60Hz physics and independent rendered train cadence
        run: godot --headless --path . --script res://tests/frame_pacing_smoke.gd
      - name: Assert city generation and district composition
        run: godot --headless --path . --script res://tests/city_smoke.gd
      - name: Validate lighting, authored world and flora
        run: godot --headless --path . --script res://tests/world_systems_smoke.gd
      - name: Validate fixed lots and lighting/material policies
        run: godot --headless --path . --script res://tests/render_smoke.gd
      - name: Validate signals, transit boarding and persistent save seeds
        run: godot --headless --path . --script res://tests/transport_smoke.gd
      - name: Validate Kestrel S6 hero body, dynamic lights and save stability
        run: godot --headless --path . --script res://tests/hero_vehicle_smoke.gd
      - name: Validate Central Exchange junction architecture and signal-safe lighting
        run: godot --headless --path . --script res://tests/hero_intersection_smoke.gd
      - name: Validate new Central Exchange true-mesh architecture, source PBR and persistence
        run: godot --headless --path . --script res://tests/central_frontages_smoke.gd
      - name: Validate permanent venues, opening hours and side quests
        run: godot --headless --path . --script res://tests/venues_smoke.gd
      - name: Validate expanded eight-district seeded world and civic gameplay
        run: godot --headless --path . --script res://tests/expansion_smoke.gd
      - name: Validate on-demand district geometry and fully enterable interior rooms
        run: godot --headless --path . --script res://tests/streaming_interiors_smoke.gd
      - name: Validate Lantern Cup cinematic café interior, unique interaction and persistent save
        run: godot --headless --path . --script res://tests/lantern_cup_hero_smoke.gd
      - name: Validate Mara's character rig, reactive dialogue and indoor save lifecycle
        run: godot --headless --path . --script res://tests/mara_character_smoke.gd
      - name: Validate café crowd, animation, patron dialogue, economy and save restore
        run: godot --headless --path . --script res://tests/cafe_patrons_smoke.gd
      - name: Validate first-playtest club exit, camera obstruction, contact geometry and building fronts
        run: godot --headless --path . --script res://tests/playtest_geometry_smoke.gd
      - name: Validate main menus, saved settings and controller action contexts
        run: godot --headless --path . --script res://tests/menus_gamepad_smoke.gd
      - name: Run smoke test for 90 frames
        run: godot --headless --path . --quit-after 90
