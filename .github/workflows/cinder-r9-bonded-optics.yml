name: Cinder R9 original coachwork regeneration

on:
  push:
    branches: [art/cinder-r9-bonded-optics]
    paths:
      - tools/art/author_cinder_r9.py
      - scripts/road_car_visual.gd
      - tests/test_cinder_bonded_optics.py
      - tests/test_cinder_headlamp_housing.py
      - tests/test_cinder_arch_fit.py
      - tests/test_cinder_brake_hardware.py
      - tests/test_cinder_tire_tread.py
      - tests/cinder_r9_smoke.gd
      - .github/workflows/cinder-r9-bonded-optics.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate-and-check:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate original Cinder source-authored coachwork
        run: python tools/art/author_cinder_r9.py
      - name: Check optical lens geometry, normals and generated hashes
        run: python -m unittest discover -s tests -p 'test_cinder_bonded_optics.py' -v
      - name: Check manufactured reflector housing behind both bonded headlight lenses
        run: python -m unittest discover -s tests -p 'test_cinder_headlamp_housing.py' -v
      - name: Check wheel-arch tire clearance and C1 rocker fit
        run: python -m unittest discover -s tests -p 'test_cinder_arch_fit.py' -v
      - name: Verify independent static brake hardware and wheel provenance
        run: python -m unittest discover -s tests -p 'test_cinder_brake_hardware.py' -v
      - name: Validate 96-sector tire surface, four rain channels and molded sipes
        run: python -m unittest discover -s tests -p 'test_cinder_tire_tread.py' -v
      - name: Verify expected generated file set
        run: |
          python - <<'PY'
          from pathlib import Path
          base=Path("assets/models/nightgrid/road_cars")
          for name in ("cinder_r9.gltf","cinder_r9.bin","wheel.gltf","wheel.bin","source.json"):
              item=base/name
              assert item.is_file() and item.stat().st_size>1024, name
          print("Generated Cinder body + manifest present")
          PY
      - name: Commit regenerated game meshes on isolated feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/models/nightgrid/road_cars/cinder_r9.gltf \
                  assets/models/nightgrid/road_cars/cinder_r9.bin \
                  assets/models/nightgrid/road_cars/wheel.gltf \
                  assets/models/nightgrid/road_cars/wheel.bin \
                  assets/models/nightgrid/road_cars/source.json
          if git diff --cached --quiet; then
            echo "Cinder game assets already match the generator"
          else
            git commit -m "art(cinder): rebuild game glTF after verified sculpting improvements"
            git push origin HEAD:art/cinder-r9-bonded-optics
          fi
