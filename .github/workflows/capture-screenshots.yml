name: Capture actual Godot screenshots
on:
  push:
    branches:
      - art/photographic-road-network-20261121
      - docs/player-facing-readme-20261121
      - feat/real-gameplay-screenshots
      - feat/aaa-frame-pacing-capture-20261120
      - art/horizon-fern-photogrammetry-20261120
      - art/afterhours-corner-fidelity-20261120
    paths:
      - '.github/workflows/capture-screenshots.yml'
      - 'tools/capture_screenshots.gd'
      - 'project.godot'
      - 'scripts/**'
      - 'assets/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightgrid-real-screenshots
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
      - name: Prepare real offscreen X11/Mesa rendering
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libgl1 libx11-6 libxext6 libxrandr2 mesa-utils espeak-ng
          python3 tools/generate_mbpd_radio.py
          command -v xvfb-run
          godot --version
      - name: Import actual game resources
        run: |
          set -o pipefail
          godot --headless --path . --import --quit 2>&1 | tee /tmp/nightgrid-capture-import.log
          if grep -q 'SCRIPT ERROR:' /tmp/nightgrid-capture-import.log; then exit 1; fi
      - name: Render screenshots from the running 3D game
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '3.3'
          GODOT_HEADLESS: '0'
        run: |
          set -o pipefail
          mkdir -p docs/screenshots
          rm -f docs/screenshots/*.png
          xvfb-run -a -s "-screen 0 1280x720x24" \
            godot --path . --display-driver x11 --rendering-driver opengl3 \
              --rendering-method gl_compatibility --resolution 1280x720 \
              --script res://tools/capture_screenshots.gd 2>&1 | tee /tmp/nightgrid-capture.log
          if grep -q 'SCRIPT ERROR:' /tmp/nightgrid-capture.log; then exit 1; fi
          grep -q 'SCREENSHOT_CAPTURE PASS:' /tmp/nightgrid-capture.log
      - name: Verify actual nonempty PNG outputs and dimensions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct
          folder = Path('docs/screenshots')
          expected = [
              '01-morrow-bay-neon-night.png',
              '02-vesper-market-nightlife.png',
              '03-m-line-helix-terminal.png',
              '04-horizon-commons-daylight.png',
              '05-quay-fresh-interior.png',
              '06-title-menu.png',
              '07-city-map-menu.png',
          ]
          for filename in expected:
              path = folder / filename
              assert path.exists(), f'Missing actual game screenshot: {path}'
              data = path.read_bytes()
              assert data.startswith(b'\x89PNG\r\n\x1a\n'), f'Invalid PNG: {path}'
              w,h = struct.unpack('>II', data[16:24])
              assert w >= 1100 and h >= 600, f'Wrong screenshot dimensions: {path}: {w}x{h}'
              assert len(data) > 16000, f'Suspect blank screenshot: {path}: {len(data)} bytes'
              print(f'{filename}: {w}x{h}, {len(data):,} bytes')
          assert len(list(folder.glob('*.png'))) == len(expected), 'Unexpected screenshot set'
          print('SCREENSHOT VALIDATION PASS: 7 real framebuffer captures')
          PY
      - name: Record source revision and unchanged framebuffer hashes
        run: |
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import json, os
          images = {}
          for path in sorted(Path('docs/screenshots').glob('*.png')):
              payload = path.read_bytes()
              images[path.name] = {'sha256': sha256(payload).hexdigest(), 'bytes': len(payload)}
          record = {'source_revision': os.environ['GITHUB_SHA'],
                    'renderer': 'Godot 4.7.2 Mesa software OpenGL Compatibility 1280x720 (NOT Vulkan/RTX)',
                    'images': images}
          Path('docs/screenshots/capture-manifest.json').write_text(
              json.dumps(record, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
      - name: Attach screenshot proof to CI run
        uses: actions/upload-artifact@v4
        with:
          name: nightgrid-real-godot-screenshots
          path: |
            docs/screenshots/*.png
            docs/screenshots/capture-manifest.json
          if-no-files-found: error
          retention-days: 30
      - name: Commit real binary PNGs to this feature branch
        if: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Archive only freshly rendered outputs outside the working tree.
          # Never rebase binary PNG commits over another PNG capture: git
          # cannot meaningfully reconcile conflicting framebuffer bytes.
          CAPTURE_DIR="$RUNNER_TEMP/nightgrid-verified-capture"
          mkdir -p "$CAPTURE_DIR"
          cp docs/screenshots/*.png docs/screenshots/capture-manifest.json "$CAPTURE_DIR/"
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            # If actual game code/assets changed since rendering began, these
            # screenshots are stale. Fail rather than attach them to newer art.
            if ! git diff --quiet "$GITHUB_SHA" "origin/${GITHUB_REF_NAME}" -- \
                project.godot scripts scenes assets tools/capture_screenshots.gd tools/generate_mbpd_radio.py .github/workflows/capture-screenshots.yml; then
              echo "Newer game source detected during capture; refusing stale screenshots" >&2
              exit 1
            fi
            # Reapply the verified rendered files on the current branch tip.
            # This preserves all intervening code/docs and prevents binary
            # merge/rebase conflicts from overlapping capture jobs.
            git reset --hard "origin/${GITHUB_REF_NAME}"
            cp "$CAPTURE_DIR/"* docs/screenshots/
            git add docs/screenshots/*.png docs/screenshots/capture-manifest.json
            if git diff --cached --quiet; then
              echo "Verified screenshots already match the checked-in gallery"
              exit 0
            fi
            git commit -m "docs(screenshots): recapture seven real Godot 4 gameplay frames"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Concurrent publish detected; retrying on latest branch head ${attempt}/3"
          done
          echo "Could not publish screenshots without overwriting newer commits" >&2
          exit 1
