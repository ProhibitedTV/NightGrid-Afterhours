name: Offline voice studio
on:
  pull_request:
    paths:
      - 'scripts/opening_story.gd'
      - 'scripts/street_satire.gd'
      - 'tools/voice/**'
      - 'tools/audio/**'
      - 'assets/audio/voiced/**'
      - '.github/workflows/voice-studio.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/opening_story.gd'
      - 'scripts/street_satire.gd'
      - 'tools/voice/**'
      - 'tools/audio/**'
      - 'assets/audio/voiced/**'
      - '.github/workflows/voice-studio.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authoring-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m unittest discover -s tools/voice -v
      - run: python -m unittest discover -s tools/audio -v
      - run: python tools/voice/anubis.py sfx-list
      - run: python tools/voice/studio.py list

      - run: python tools/voice/chapter.py validate --source scripts/opening_story.gd
      - run: python tools/voice/chapter.py status
      - run: python tools/voice/production.py verify-library --manifest tools/voice/synaxis_chapter.json
