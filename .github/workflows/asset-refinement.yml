name: Asset refinement checks
on:
  pull_request:
    paths:
      - 'tools/asset_refinement/**'
      - '.github/workflows/asset-refinement.yml'
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m compileall -q tools/asset_refinement
      - run: bash -n tools/asset_refinement/run_refine.sh && bash -n tools/asset_refinement/run_factory.sh
      - run: python3 -m unittest discover -s tools/asset_refinement -p 'test_*.py'
  blender-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y blender python3-numpy
      - run: PYTHONPATH=/usr/lib/python3/dist-packages blender -b -t 2 --python-use-system-env --python-exit-code 1 --python tools/asset_refinement/smoke_blender.py
