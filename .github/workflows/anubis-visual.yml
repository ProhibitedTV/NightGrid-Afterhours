name: Anubis visual studio CPU checks
on:
  pull_request:
    paths:
      - 'tools/visual_studio/**'
      - '.github/workflows/anubis-visual.yml'
  push:
    branches: [main]
    paths:
      - 'tools/visual_studio/**'
      - '.github/workflows/anubis-visual.yml'
permissions:
  contents: read
jobs:
  coordinator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: bash -n tools/visual_studio/run_anubis_visual.sh
      - run: python -m compileall -q tools/visual_studio
      - run: python -m unittest discover -s tools/visual_studio -p 'test_*.py' -v
      - run: python tools/visual_studio/batch.py plan
