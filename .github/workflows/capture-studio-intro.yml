name: Studio intro framebuffer QA
on:
  push:
    branches: [presentation/bitriver-studio-intro]
    paths:
      - 'scripts/studio_intro.gd'
      - 'scenes/studio_intro.tscn'
      - 'assets/branding/**'
      - 'tools/capture_studio_intro.gd'
      - '.github/workflows/capture-studio-intro.yml'
permissions:
  contents: read
concurrency:
  group: studio-intro-${{ github.ref }}
  cancel-in-progress: true
jobs:
  capture:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    strategy:
      matrix:
        resolution: [1280x720, 1920x1080]
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
      - name: Set up graphical driver
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libgl1 libx11-6 libxext6 libxrandr2
      - name: Import project
        run: |
          set -o pipefail
          godot --headless --path . --import --quit 2>&1 | tee /tmp/studio-import.log
          if grep -q 'SCRIPT ERROR:' /tmp/studio-import.log; then exit 1; fi
      - name: Render real ident frames
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          STUDIO_CAPTURE_OUT: ${{ runner.temp }}/studio
          RESOLUTION: ${{ matrix.resolution }}
        run: |
          set -euo pipefail
          timeout 90s xvfb-run -a -s "-screen 0 ${RESOLUTION}x24" godot --path . --display-driver x11 --audio-driver Dummy --rendering-driver opengl3 --rendering-method gl_compatibility --resolution "$RESOLUTION" --script res://tools/capture_studio_intro.gd 2>&1 | tee /tmp/studio-capture.log
          if grep -q 'SCRIPT ERROR:' /tmp/studio-capture.log; then exit 1; fi
          grep -q 'STUDIO_CAPTURE PASS:' /tmp/studio-capture.log
          python3 - <<'PY'
          import hashlib, json, os, struct
          from pathlib import Path
          folder = Path(os.environ["STUDIO_CAPTURE_OUT"])
          expected = {"01-signal.png", "02-impact.png", "03-studio.png"}
          assert {p.name for p in folder.glob("*.png")} == expected
          resolution = tuple(map(int, os.environ["RESOLUTION"].split("x")))
          entries = {}
          for p in sorted(folder.glob("*.png")):
              raw = p.read_bytes()
              assert raw.startswith(b"\x89PNG\r\n\x1a\n") and len(raw) > 1000
              assert struct.unpack(">II", raw[16:24]) == resolution
              entries[p.name] = hashlib.sha256(raw).hexdigest()
          assert len(set(entries.values())) == len(expected)
          (folder / "manifest.json").write_text(json.dumps({"source_revision": os.environ["GITHUB_SHA"], "renderer": "Godot 4.7.2 software OpenGL", "resolution": os.environ["RESOLUTION"], "frames": entries}, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-intro-${{ matrix.resolution }}
          path: |
            ${{ runner.temp }}/studio
            /tmp/studio-import.log
            /tmp/studio-capture.log
          if-no-files-found: warn
          retention-days: 14
