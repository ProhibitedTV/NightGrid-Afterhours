name: Pin original Poly Haven CC0 Hidden Alley street props
# Restricted one-time pinning, not a game/runtime build dependency.
on:
  push:
    branches: [art/central-exchange-hidden-alley-20261121]
    paths:
      - tools/import_polyhaven_urban_props.py
      - .github/workflows/pin-central-exchange-urban-props.yml
permissions:
  contents: write
jobs:
  pin-source-photoscans:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download verified official 1K glTF/PBR sources under CC0
        run: python tools/import_polyhaven_urban_props.py
      - name: Commit only these two audited source asset directories
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "art/central-exchange-hidden-alley-20261121"
          git add -- assets/models/polyhaven/metal_trash_can/ assets/models/polyhaven/utility_box_01/
          if git diff --cached --quiet; then
            echo "Exact source assets already pinned"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "assets(cc0): pin photographed urban prop source glTFs and 1K textures"
          git push origin HEAD:refs/heads/art/central-exchange-hidden-alley-20261121
