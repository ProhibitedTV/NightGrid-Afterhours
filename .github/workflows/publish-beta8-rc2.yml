name: Publish Beta.8 RC2 candidate
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact tested main commit (40 hex characters)
        required: true
      gallery_sha:
        description: Reviewed cockpit gallery commit (40 hex characters)
        required: true
permissions:
  contents: write
  actions: read
concurrency:
  group: nightgrid-beta8-rc2
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      GALLERY_SHA: ${{ inputs.gallery_sha }}
      RELEASE_TAG: v0.1.0-beta.8-rc.2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require current main, exact successful preflight and exported Windows smoke
        id: gate
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ && "$GALLERY_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$SOURCE_SHA"
          grep -Fx 'const VERSION = "0.1.0-beta.8-rc.2"' scripts/build_info.gd
          for wf in preflight.yml windows-build.yml; do
            run="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?head_sha=$SOURCE_SHA&branch=main&event=push&status=success&per_page=10" --jq '.workflow_runs[0].id // empty')"
            test -n "$run"
            if [ "$wf" = windows-build.yml ]; then
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs" --jq '.jobs[] | select(.name=="Verify delivered Windows EXE/PCK and launch" and .conclusion=="success") | .id' | grep -E '^[0-9]+$'
              echo "windows_run=$run" >> "$GITHUB_OUTPUT"
            fi
          done
          git fetch --no-tags origin "$GALLERY_SHA"
          python3 tools/check_rc2_cockpit_gallery.py "$SOURCE_SHA" "$GALLERY_SHA"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing tag or release" >&2
            exit 1
          fi
      - name: Download the actual already-tested Windows artifact
        env:
          WINDOWS_RUN: ${{ steps.gate.outputs.windows_run }}
        run: |
          set -euo pipefail
          gh run download "$WINDOWS_RUN" --repo "$GITHUB_REPOSITORY" --name nightgrid-afterhours-windows-x64 --dir payload
          grep -Fx "Source commit: $SOURCE_SHA" payload/BUILD-INFO.txt
          grep -Fx "Channel: development" payload/BUILD-INFO.txt
          (cd payload && sha256sum -c SHA256SUMS.txt)
          test -s payload/NightGrid-Afterhours.exe
          test -s payload/NightGrid-Afterhours.pck
          mkdir -p dist
          package="NightGrid-Afterhours-$RELEASE_TAG-windows-x64"
          mkdir "$package"
          cp payload/* "$package/"
          cp docs/BETA8_RC2.md "$package/RELEASE-NOTES.md"
          (cd "$package" && sha256sum RELEASE-NOTES.md >> SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          zip -q -r "dist/$package.zip" "$package"
          unzip -t "dist/$package.zip"
          (cd dist && sha256sum "$package.zip" > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
      - name: Publish explicitly reviewed candidate without overwriting any release
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$SOURCE_SHA"
          package="NightGrid-Afterhours-$RELEASE_TAG-windows-x64"
          gh release create "$RELEASE_TAG" "dist/$package.zip" dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --title "NightGrid: Afterhours — Beta.8 RC2 Windows review" --notes-file docs/BETA8_RC2.md --prerelease
