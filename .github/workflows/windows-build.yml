name: Windows playtest build
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main, integration/nightgrid-2026-11-20-playtest]
    paths:
      - 'scripts/**'
      - 'scenes/**'
      - 'project.godot'
      - 'export_presets.cfg'
      - '.github/workflows/windows-build.yml'
      - '.github/workflows/playtest-evidence.yml'
      - 'tests/**'
      - 'tools/capture_playtest_evidence.gd'
      - 'docs/NEXT_PLAYTEST.md'
      - 'playtest-evidence/README.md'

permissions:
  contents: read

jobs:
  export-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true
      - name: Embed exact GitHub revision and build metadata for player bug reports
        run: |
          python3 - <<'PY'
          import os, json
          from pathlib import Path
          sha = os.environ["GITHUB_SHA"]
          Path("scripts/playtest_build.gd").write_text(
              'extends RefCounted\n'
              f'const SOURCE_REVISION = "{sha}"\n'
              'const BUILD_FLAVOR = "github-windows-x64-forwardplus"\n',
              encoding="utf-8")
          Path("dist").mkdir(exist_ok=True)
          Path("dist/playtest-build-info.json").write_text(
              json.dumps({"source_revision": sha, "platform": "Windows x64",
                          "renderer": "Godot 4.3 Forward+ Vulkan",
                          "frame_capture": "F7 toggle CSV/JSON; F8 screenshot PNG/JSON",
                          "evidence_folder": "user://playtest_evidence"},
                          sort_keys=True, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Import resources
        run: godot --headless --path . --import --quit
      - name: Export Windows executable
        run: |
          mkdir -p dist
          godot --headless --path . --export-release "Windows Desktop" "dist/NightGrid-Afterhours.exe"
          test -s dist/NightGrid-Afterhours.exe
      - name: Upload Windows playtest
        uses: actions/upload-artifact@v4
        with:
          name: nightgrid-afterhours-windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 30
