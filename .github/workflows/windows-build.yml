name: Windows playtest build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'scenes/**'
      - 'project.godot'
      - 'export_presets.cfg'
      - '.github/workflows/windows-build.yml'

permissions:
  contents: read

jobs:
  export-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true
      - name: Import resources
        run: godot --headless --path . --import --quit
      - name: Export Windows executable
        run: |
          mkdir -p dist
          godot --headless --path . --export-release "Windows Desktop" "dist/NightGrid-Afterhours.exe"
          test -s dist/NightGrid-Afterhours.exe
      - name: Upload Windows playtest
        uses: actions/upload-artifact@v4
        with:
          name: nightgrid-afterhours-windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 30
