name: Windows playtest build
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'scenes/**'
      - 'project.godot'
      - 'export_presets.cfg'
      - '.github/workflows/windows-build.yml'

permissions:
  contents: read

jobs:
  export-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - name: Generate original offline MBPD radio speech
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng
          python3 tools/generate_mbpd_radio.py
      - name: Import resources
        run: |
          set -o pipefail
          godot --headless --path . --import --quit 2>&1 | tee /tmp/nightgrid-import.log
          if grep -q "SCRIPT ERROR:" /tmp/nightgrid-import.log; then exit 1; fi
      - name: Export Windows executable
        run: |
          mkdir -p dist
          godot --headless --path . --export-release "Windows Desktop" "dist/NightGrid-Afterhours.exe"
          test -s dist/NightGrid-Afterhours.exe
          cp assets/models/nightgrid/courier/SOURCE.md dist/COURIER-ASSET-CREDITS.md
      - name: Upload Windows playtest
        uses: actions/upload-artifact@v4
        with:
          name: nightgrid-afterhours-windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 30
