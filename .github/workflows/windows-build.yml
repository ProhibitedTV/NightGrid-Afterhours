name: Windows playtest build
on:
  pull_request:
  workflow_dispatch:
  push:
    # The release gate requires an exact main SHA, including test-only changes.
    branches: [main]

permissions:
  contents: read

jobs:
  export-windows:
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The PR's source head, not an ephemeral refs/pull/N/merge SHA.
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - name: Stamp source revision into development build
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path("scripts/build_info.gd")
          text = path.read_text(encoding="utf-8")
          marker = 'const REVISION = "development"'
          assert text.count(marker) == 1, "Unexpected build-info source"
          assert text.count('const CHANNEL = "development"') == 1
          text = text.replace(marker, f'const REVISION = "{os.environ["SOURCE_SHA"]}"')
          path.write_text(text, encoding="utf-8")
          PY
          grep -q "$SOURCE_SHA" scripts/build_info.gd
      - name: Generate original offline MBPD radio speech
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng
          python3 tools/generate_mbpd_radio.py
      - name: Import resources
        run: |
          set -o pipefail
          godot --headless --path . --import --quit 2>&1 | tee /tmp/nightgrid-import.log
          if grep -Eq 'SCRIPT ERROR:|p_image->is_compressed\(\)|Cannot generate mipmaps from compressed image formats' /tmp/nightgrid-import.log; then exit 1; fi
      - name: Export Windows executable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          godot --headless --path . --export-release "Windows Desktop" "dist/NightGrid-Afterhours.exe"
          test -s dist/NightGrid-Afterhours.exe
          test -s dist/NightGrid-Afterhours.pck
          cp assets/models/nightgrid/courier/SOURCE.md dist/COURIER-ASSET-CREDITS.md
          cp assets/audio/nightgrid_fm/README.md dist/NIGHTGRID-FM-CREDITS.md
          cp assets/audio/morrow_bay/SOURCE.md dist/MORROW-BAY-AUDIO-CREDITS.md
          cp docs/PLAYTEST_MAIN_ACCEPTANCE.md dist/PLAYTEST-GUIDE.md
      - name: Verify candidate archive contents and SHA-256 manifest
        shell: bash
        run: |
          set -euo pipefail
          printf 'NightGrid: Afterhours Windows x64 playtest\nSource commit: %s\nChannel: development\nGodot: 4.7.2\nRenderer: Forward+ / Vulkan\nThis is not a published beta release.\n' "$SOURCE_SHA" > dist/BUILD-INFO.txt
          (
            cd dist
            sha256sum NightGrid-Afterhours.exe NightGrid-Afterhours.pck \
              BUILD-INFO.txt COURIER-ASSET-CREDITS.md NIGHTGRID-FM-CREDITS.md \
              MORROW-BAY-AUDIO-CREDITS.md PLAYTEST-GUIDE.md > SHA256SUMS.txt
            sha256sum --check SHA256SUMS.txt
          )
          grep -Fx "Source commit: $SOURCE_SHA" dist/BUILD-INFO.txt
      - name: Upload Windows playtest
        uses: actions/upload-artifact@v4
        with:
          name: nightgrid-afterhours-windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  windows-artifact-smoke:
    name: Verify delivered Windows EXE/PCK and launch
    needs: export-windows
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Download the actual exported Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: nightgrid-afterhours-windows-x64
          path: dist
      - name: Verify manifest, exact commit and all delivered file hashes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @('NightGrid-Afterhours.exe', 'NightGrid-Afterhours.pck', 'BUILD-INFO.txt', 'SHA256SUMS.txt',
            'COURIER-ASSET-CREDITS.md', 'NIGHTGRID-FM-CREDITS.md', 'MORROW-BAY-AUDIO-CREDITS.md', 'PLAYTEST-GUIDE.md')
          foreach ($name in $required) {
            if (-not (Test-Path -LiteralPath (Join-Path 'dist' $name) -PathType Leaf)) {
              throw "Missing Windows artifact file: $name"
            }
          }
          $identity = Get-Content -LiteralPath 'dist/BUILD-INFO.txt' -Raw
          if (-not $identity.Contains("Source commit: $env:EXPECTED_SOURCE_SHA")) {
            throw "Delivered Windows package does not identify exact PR head $env:EXPECTED_SOURCE_SHA"
          }
          if (-not $identity.Contains('Channel: development')) { throw 'Unexpected release channel' }
          $lines = Get-Content -LiteralPath 'dist/SHA256SUMS.txt'
          if ($lines.Count -ne ($required.Count - 1)) { throw 'Checksum manifest is incomplete' }
          foreach ($line in $lines) {
            if ($line -notmatch '^([0-9a-f]{64})  (.+)$') { throw "Malformed checksum line: $line" }
            $expected = $Matches[1]
            $name = $Matches[2]
            $file = Join-Path 'dist' $name
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing manifest entry: $name" }
            $actual = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected) { throw "SHA-256 mismatch: $name" }
          }
          Write-Output "WINDOWS_ARTIFACT_VERIFY PASS: exact source commit, eight required files, seven SHA256 matches"
      - name: Launch the exported Windows game in headless startup smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path -LiteralPath 'dist/NightGrid-Afterhours.exe').Path
          $stdout = Join-Path $env:RUNNER_TEMP 'nightgrid-windows-smoke-stdout.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'nightgrid-windows-smoke-stderr.txt'
          $process = Start-Process -FilePath $exe -ArgumentList @('--headless', '--quit-after', '90') `
            -WorkingDirectory (Resolve-Path 'dist').Path -PassThru -NoNewWindow `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (-not $process.WaitForExit(240000)) {
            $process.Kill()
            throw 'Exported Windows game did not terminate after 90 headless frames'
          }
          $process.Refresh()
          $logs = ((Get-Content $stdout -Raw -ErrorAction SilentlyContinue) +
            (Get-Content $stderr -Raw -ErrorAction SilentlyContinue))
          Write-Output $logs
          if ($process.ExitCode -ne 0) { throw "Windows game exited with code $($process.ExitCode)" }
          if ($logs -match 'SCRIPT ERROR:|Parse Error:|ERROR: Cannot open') {
            throw 'Windows game emitted a runtime parse/startup error'
          }
          Write-Output 'WINDOWS_EXPORTED_GAME_SMOKE PASS: packaged EXE/PCK startup and clean headless exit'
