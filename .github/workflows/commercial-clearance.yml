name: Commercial clearance checker
on:
  pull_request:
    paths:
      - 'tools/release/check_commercial_clearance.py'
      - 'tests/test_commercial_clearance.py'
      - '.github/workflows/commercial-clearance.yml'
  workflow_dispatch:
jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tests/test_commercial_clearance.py
